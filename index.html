<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1: January - September 2017 North American Weather Patterns Visualization</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container"> <!-- Centers content and sets max width -->
        <h1>Project 1: January - September 2017 North American Weather Patterns Visualization</h1>
    </div>

    <p id="value"></p>
    <div id="slider"></div>

    <div class="controls">
        Color: <select id="colorVariable" class="variable"></select>
        Size: <select id="sizeVariable" class="variable"></select>
        Units: <select id="unitVariable" class="variable"></select>
    </div>

    <div id="vis"></div> <!--  Will hold our visualization (SVG) -->
    <div id="legend"></div> <!-- Holds legends outside the map -->
    <div id="tooltip" style="display:none"></div>

    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <script src="https://unpkg.com/d3-simple-slider"></script>
    <script src="js/script.js"></script>
</body>

</html>
